<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>PokeTCG - Inscription</title>
    <!-- Les liens vers les styles -->
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<header class="glass">
    <button class="btn-nav pokedex" onclick="window.location.href='pokedexmondial.html'">POKEDEX</button>
    <div class="header-logo">
        <img src="../assets/logo.png" alt="Logo"> <!-- Utilise assets/logo.png pour l'accueil -->
    </div>
    <button class="btn-nav accueil" onclick="window.location.href='../index.html'">ACCUEIL</button>
</header>

<main>

    <!-- Titre Inscription -->
    <div class="news-pill">
        <h2>Inscription</h2>
    </div>

    <!-- LE FORMULAIRE POKÉBALL (Structure identique au login) -->
    <div class="pokeball-container">
        <img src="../assets/pokeball-top.png" alt="top" class="pb-img">

        <div class="login-form">
            <div class="field">
                <label>USERNAME</label>
                <input type="text" id="reg-username" placeholder="Pseudo...">
            </div>
            <div class="field">
                <label>EMAIL</label>
                <input type="email" id="reg-email" placeholder="ton@email.com">
            </div>
            <div class="field">
                <label>MOT DE PASSE</label>
                <input type="password" id="reg-password" placeholder="••••••••">
            </div>
            <div class="field">
                <label>ADRESSE</label>
                <input type="text" id="reg-address" placeholder="123 rue de Kanto...">
            </div>
            <div class="field">
                <label>CODE POSTAL</label>
                <input type="text" id="reg-zip" placeholder="Ex: 75001">
            </div>

            <!-- Bouton identique au style Pokedex (Solid + Jaune) -->
            <button class="btn-nav pokedex" id="register-btn" style="width: 100%; margin-top: 10px;">S'INSCRIRE</button>

            <p class="auth-switch">Déjà dresseur ? <a href="login.html" style="color: var(--poke-yellow);">Connecte-toi</a></p>
        </div>

        <img src="../assets/pokeball-bottom.png" alt="bottom" class="pb-img">
    </div>
</main>

<footer>
    <div class="footer-left">Toutes les images sont la propriété de Nintendo et de The Pokémon Company.</div>
    <div class="footer-center">© 2024 PokeTCG — Réalisé par Habib Akerim</div>
    <div class="footer-right">
        <a href="#"><img src="../assets/fb-icon.png" alt="Facebook"></a>
        <a href="#"><img src="../assets/discord-icon.png" alt="Discord"></a>
        <a href="#"><img src="../assets/insta-icon.png" alt="Instagram"></a>
    </div>
</footer>

<script src="../js/register.js"></script>
</body>
</html>
