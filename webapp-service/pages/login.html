<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>PokeTCG - Connexion</title>
    <!-- Je lie scrupuleusement les CSS en remontant d'un dossier -->
    <link rel="stylesheet" href="../css/common.css">
    <!-- J'utilise home.css pour garder le placement du logo et du footer identiques -->
    <link rel="stylesheet" href="../css/home.css">
    <!-- J'ajoute login.css uniquement pour la pokéball -->
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<header class="glass">
    <!-- Bouton Pokedex à gauche -->
    <button class="btn-nav pokedex" onclick="window.location.href='pokedexmondial.html'">POKEDEX</button>

    <div class="header-logo">
        <img src="../assets/logo.png" alt="Logo"> <!-- Utilise assets/logo.png pour l'accueil -->
    </div>

    <!-- Bouton Accueil à droite (remplace Connexion) -->
    <button class="btn-nav accueil" onclick="window.location.href='../index.html'">ACCUEIL</button>
</header>

<main>

    <!-- Titre de la page (Capsule comme sur Figma) -->
    <div class="news-pill">
        <h2>Connexion</h2>
    </div>

    <!-- LE FORMULAIRE POKÉBALL -->
    <div class="pokeball-container">
        <img src="../assets/pokeball-top.png" alt="top" class="pb-img">

        <div class="login-form">
            <div class="field">
                <label>USERNAME</label>
                <input type="text" id="username" placeholder="Pseudo...">
            </div>
            <div class="field">
                <label>MOT DE PASSE</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button class="btn-nav connexion" id="login-btn" style="width: 100%; margin-top: 10px;">Connexion</button>
            <p class="auth-switch">
                Pas encore dresseur ? <a href="register.html" style="color: var(--poke-yellow);">Inscris-toi</a>
            </p>
        </div>

        <img src="../assets/pokeball-bottom.png" alt="bottom" class="pb-img">
    </div>
</main>

<footer>
    <div class="footer-left">Toutes les images et contenus liés à Pokémon sont la propriété de Nintendo et de The Pokémon Company.</div>
    <div class="footer-center">© 2024 PokeTCG — Réalisé par Habib Akerim</div>
    <div class="footer-right">
        <a href="#"><img src="../assets/fb-icon.png" alt="Facebook"></a>
        <a href="#"><img src="../assets/discord-icon.png" alt="Discord"></a>
        <a href="#"><img src="../assets/insta-icon.png" alt="Instagram"></a>
    </div>
</footer>

<script src="../js/login.js"></script>
</body>
</html>
