services:
  # --- INFRASTRUCTURE ---
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: poketcg_db
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u root -proot"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  mongodb:
    image: mongo:latest
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: pokeadmin
      MONGO_INITDB_ROOT_PASSWORD: pokepassword
    ports:
      - "27018:27017"

  consul:
    image: hashicorp/consul:latest
    container_name: consul
    ports:
      - "8500:8500"
    command: "agent -dev -client 0.0.0.0"

  # --- MICROSERVICES ---
  identity-service:
    build: ./identity-service
    ports:
      - "8081:8081"
    depends_on:
      mysql-db:
        condition: service_started
      consul:
        condition: service_started
    restart: on-failure

  wallet-service:
    build: ./wallet-service
    ports:
      - "8082:8082"
    depends_on:
      mysql-db:
        condition: service_started
      consul:
        condition: service_started
    restart: on-failure

  catalog-service:
    build: ./catalog-service
    ports:
      - "8083:8083"
    depends_on:
      mongodb:
        condition: service_started
      consul:
        condition: service_started
    restart: on-failure

  inventory-service:
    build: ./inventory-service
    ports:
      - "8084:8084"
    depends_on:
      mysql-db:
        condition: service_started
      consul:
        condition: service_started
    restart: on-failure

  marketplace-service:
    build: ./marketplace-service
    ports:
      - "8085:8085"
    depends_on:
      mysql-db:
        condition: service_started
      consul:
        condition: service_started
    restart: on-failure

  social-service:
    build: ./social-service
    ports:
      - "8086:8086"
    depends_on:
      mongodb:
        condition: service_started
      consul:
        condition: service_started
    restart: on-failure

  # --- FRONTEND ---
  webapp:
    image: nginx:alpine
    container_name: poketcg-site
    volumes:
      - ./webapp-service:/usr/share/nginx/html
    ports:
      - "80:80"
    depends_on:
      - identity-service